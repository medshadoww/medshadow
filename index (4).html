<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MedShadow</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#F0F4F8;color:#1E293B;min-height:100vh}
:root{
  --navy:#0A2540;--teal:#0098B4;--teal-l:#E0F5FA;--teal-d:#007A91;
  --green:#059669;--green-l:#D1FAE5;--red:#DC2626;--red-l:#FEE2E2;
  --amber:#D97706;--amber-l:#FEF3C7;
  --bg:#F0F4F8;--white:#fff;--gray:#F8FAFC;
  --border:#E2E8F0;--text2:#475569;--text3:#94A3B8;
  --shadow:0 1px 3px rgba(0,0,0,.08);--shadow-md:0 4px 12px rgba(0,0,0,.1);
}
h1,h2,h3{font-family:'Libre Baskerville',serif;line-height:1.25}
button{font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;border:none}
input,select,textarea{font-family:'Plus Jakarta Sans',sans-serif;width:100%;padding:10px 14px;border:1.5px solid #CBD5E1;border-radius:8px;font-size:14px;background:#fff;color:#1E293B;transition:border-color .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(0,152,180,.12)}
textarea{resize:vertical;min-height:80px}
label{display:block;font-size:13px;font-weight:600;color:#475569;margin-bottom:5px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .2s}
.btn-primary{background:var(--teal);color:#fff}.btn-primary:hover{background:var(--teal-d)}
.btn-outline{background:transparent;color:var(--teal);border:1.5px solid var(--teal)}.btn-outline:hover{background:var(--teal-l)}
.btn-ghost{background:transparent;color:#475569;border:1.5px solid #CBD5E1}.btn-ghost:hover{background:#F8FAFC}
.btn-danger{background:var(--red);color:#fff}
.btn-success{background:var(--green);color:#fff}
.btn-sm{padding:7px 14px;font-size:13px}
.btn-lg{padding:14px 28px;font-size:16px}
.btn-full{width:100%;justify-content:center}
.btn:disabled{opacity:.5;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.badge-green{background:var(--green-l);color:var(--green)}
.badge-teal{background:var(--teal-l);color:var(--teal-d)}
.badge-amber{background:var(--amber-l);color:var(--amber)}
.badge-red{background:var(--red-l);color:var(--red)}
.badge-gray{background:#F1F5F9;color:#475569}
.card{background:#fff;border-radius:12px;border:1px solid var(--border);box-shadow:var(--shadow);padding:1.5rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}
.nav{position:sticky;top:0;z-index:100;background:var(--navy);display:flex;align-items:center;justify-content:space-between;padding:0 2rem;height:64px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.nav-logo{display:flex;align-items:center;gap:10px;cursor:pointer}
.nav-logo-mark{width:36px;height:36px;background:var(--teal);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}
.nav-logo-text{font-family:'Libre Baskerville',serif;font-size:1.25rem;color:#fff;font-weight:700}
.nav-logo-text span{color:var(--teal)}
.nav-actions{display:flex;align-items:center;gap:10px}
.nav-user{display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;cursor:pointer;flex-shrink:0}
.sidebar{width:230px;background:var(--navy);padding:1.5rem 0;flex-shrink:0;min-height:calc(100vh - 64px)}
.sidebar-label{font-size:11px;font-weight:700;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.08em;padding:0 1.75rem;margin-bottom:.5rem}
.sidebar-item{display:flex;align-items:center;gap:10px;padding:9px 1rem;border-radius:8px;margin:0 .75rem 2px;color:rgba(255,255,255,.65);font-size:14px;font-weight:500;cursor:pointer;transition:all .2s}
.sidebar-item:hover{background:rgba(255,255,255,.08);color:#fff}
.sidebar-item.active{background:rgba(0,152,180,.2);color:var(--teal)}
.sidebar-section{margin-bottom:1.5rem}
.layout{display:flex;min-height:calc(100vh - 64px)}
.main{flex:1;padding:2rem;overflow-y:auto;min-width:0}
.form-group{margin-bottom:1.2rem}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.divider{height:1px;background:var(--border);margin:1.5rem 0}
.or-div{display:flex;align-items:center;gap:12px;color:var(--text3);font-size:13px;margin:1rem 0}
.or-div::before,.or-div::after{content:'';flex:1;height:1px;background:var(--border)}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--border);margin-bottom:1.5rem}
.tab{padding:10px 16px;font-size:14px;font-weight:600;color:#475569;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s;border-radius:4px 4px 0 0}
.tab.active{color:var(--teal);border-bottom-color:var(--teal);background:var(--teal-l)}
.section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem}
.section-title{font-family:'Libre Baskerville',serif;font-size:1.3rem;color:#1E293B}
.stat-card{background:#fff;border-radius:12px;border:1px solid var(--border);padding:1.25rem}
.stat-val{font-size:2rem;font-weight:700;color:var(--navy);line-height:1}
.stat-lbl{font-size:13px;color:#475569;font-weight:500;margin-top:4px}
.stat-sub{font-size:12px;color:#94A3B8;margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;padding:10px 14px;font-size:12px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.05em;background:#F8FAFC;border-bottom:1px solid var(--border)}
td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#FAFBFC}
.upload-zone{border:2px dashed #CBD5E1;border-radius:12px;padding:2rem;text-align:center;cursor:pointer;transition:all .2s;background:#F8FAFC}
.upload-zone:hover{border-color:var(--teal);background:var(--teal-l)}
.alert{padding:12px 16px;border-radius:8px;font-size:14px;margin-bottom:1rem;display:flex;gap:10px}
.alert-warn{background:var(--amber-l);color:var(--amber)}
.alert-info{background:var(--teal-l);color:var(--teal-d)}
.alert-danger{background:var(--red-l);color:var(--red)}
.alert-success{background:var(--green-l);color:var(--green)}
.sched-item{display:flex;gap:14px;padding:14px;background:#fff;border:1px solid var(--border);border-radius:12px;margin-bottom:10px}
.sched-date{min-width:52px;text-align:center;background:var(--teal-l);border-radius:8px;padding:8px 6px}
.progress-bar{background:var(--border);border-radius:20px;height:8px;overflow:hidden}
.progress-fill{height:100%;border-radius:20px;background:var(--teal);transition:width .4s}
.opp-card{background:#fff;border-radius:12px;border:1px solid var(--border);box-shadow:var(--shadow);padding:1.25rem;transition:box-shadow .2s,transform .2s}
.opp-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.opp-footer{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.course-card{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.steps{display:flex;align-items:flex-start;margin-bottom:2rem}
.step{display:flex;flex-direction:column;align-items:center;flex:1}
.step-num{width:32px;height:32px;border-radius:50%;border:2px solid #CBD5E1;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#94A3B8;background:#fff;flex-shrink:0}
.step.active .step-num{border-color:var(--teal);color:var(--teal);background:var(--teal-l)}
.step.done .step-num{border-color:var(--green);background:var(--green);color:#fff}
.step-lbl{font-size:12px;font-weight:600;color:#94A3B8;margin-top:5px;text-align:center}
.step.active .step-lbl{color:var(--teal)}
.step.done .step-lbl{color:var(--green)}
.step-line{flex:1;height:2px;background:var(--border);margin-top:16px}
.step.done+.step-line,.step.done .step-line{background:var(--green)}
.payment-box{background:linear-gradient(135deg,#0A2540,#0D3259);border-radius:16px;padding:2rem;color:#fff;margin-bottom:1.5rem}
.hidden{display:none!important}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .3s ease}
@media(max-width:768px){.grid2,.grid3,.grid4{grid-template-columns:1fr}.form-row{grid-template-columns:1fr}.sidebar{width:200px}}
</style>
</head>

<div id="toast-container" style="position:fixed;bottom:2rem;right:2rem;z-index:9999;display:flex;flex-direction:column;gap:8px"></div>

// STATE
// ─────────────────────────────────────────────
var S = {
  db: null, stripe: null,
  page: 'landing', tab: '',
  user: null, profile: null, role: null,

// ─────────────────────────────────────────────
// UTILS
// ─────────────────────────────────────────────
function $(id){ return document.getElementById(id); }
function html(id, h){ var el=$(id); if(el) el.innerHTML = h; }

function toast(msg, type) {
  type = type || 'success';
  var colors = { success:'#059669', error:'#DC2626', info:'#0098B4', warning:'#D97706' };
  var bg = colors[type] || '#0A2540';
  var t = document.createElement('div');
  t.style.cssText = 'padding:12px 18px;border-radius:10px;font-size:14px;font-weight:600;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.2);max-width:340px;line-height:1.5;background:'+bg+';transition:opacity .3s';
  t.textContent = msg;
  var tc = $('toast-container');
  if (tc) tc.appendChild(t);
  var dur = type === 'info' ? 2500 : 4500;
  setTimeout(function(){ t.style.opacity='0'; setTimeout(function(){t.remove();},300); }, dur);
}

function showPage(page, tab) {
  S.page = page;
  if (tab) S.tab = tab;
  render();
}
function setTab(tab) { S.tab = tab; render(); }

function initials(name) {
  if (!name) return '?';
  return name.trim().split(' ').map(function(w){ return w[0]; }).join('').slice(0,2).toUpperCase();
}

// ─────────────────────────────────────────────
// RENDER ROUTER
// ─────────────────────────────────────────────
function render() {
  var pc = $('page-content');
  if (!pc) return;
  pc.className = 'fade-in';
  void pc.offsetWidth;
  switch(S.page) {
    case 'landing':  pc.innerHTML = pageLanding(); break;
    case 'login':    pc.innerHTML = pageLogin(); break;
    case 'register': pc.innerHTML = pageRegister(); break;
    case 'student':  pc.innerHTML = pageDash('student'); break;
    case 'doctor':   pc.innerHTML = pageDash('doctor'); break;
    case 'admin':    pc.innerHTML = pageDash('admin'); break;
    default:         pc.innerHTML = pageLanding();
  }
  updateNav();
  // Payment disabled during free promo period — no Stripe mount needed
}

// Mount Stripe Elements card field into #stripe-card div
function mountStripeCard() {
  var el = $('stripe-card');
  if (!el) return;
  if (el.dataset.mounted === '1') return; // already mounted
  if (!S.stripe) {
    // Stripe not loaded yet, retry in 300ms
    setTimeout(mountStripeCard, 300);
    return;
  }
  el.dataset.mounted = '1';
  var elements = S.stripe.elements();
  S._cardEl = elements.create('card', {
    style: {
      base: {
        fontFamily: "'Plus Jakarta Sans', sans-serif",
        fontSize: '15px',
        color: '#1E293B',
        '::placeholder': { color: '#94A3B8' }
      },
      invalid: { color: '#DC2626' }
    },
    hidePostalCode: true
  });
  S._cardEl.mount('#stripe-card');
  S._cardEl.on('change', function(e) {
    var errEl = $('stripe-err');
    if (errEl) {
      if (e.error) { errEl.style.display = 'block'; errEl.textContent = e.error.message; }
      else { errEl.style.display = 'none'; }
    }
  });
}

function updateNav() {
  var nav = document.querySelector('.nav .nav-actions');
  if (!nav) return;
  if (S.user && S.profile) {
    nav.innerHTML = '<div class="nav-user"><span style="color:rgba(255,255,255,.6);font-size:13px">'+S.profile.full_name.split(' ')[0]+'</span><div class="avatar" onclick="doSignOut()" title="Sign out">'+initials(S.profile.full_name)+'</div></div>';
  } else {
    nav.innerHTML = '<button class="btn btn-ghost btn-sm" style="color:#fff;border-color:rgba(255,255,255,.4)" onclick="showPage(\'login\')">Sign In</button><button class="btn btn-primary btn-sm" onclick="showPage(\'register\')">Get Started</button>';
  }
}

var loginRole = 'student';
function setLoginRole(r) {
  loginRole = r;
  ['student','doctor','admin'].forEach(function(rr) {
    var el = $('pt-'+rr);
    if (el) { el.style.background = rr===r?'#0A2540':''; el.style.color = rr===r?'#fff':'#475569'; }

async function doLogin() {
  var email = $('li-email') && $('li-email').value.trim();
  var pass  = $('li-pass')  && $('li-pass').value;
  var err   = $('li-err');
  var btn   = $('li-btn');
  if (!email || !pass) { if(err){err.style.display='block';err.textContent='Please enter email and password.';} return; }
  if (!S.db) { toast('Connecting to server... please try again in a moment.','error'); return; }
  if (btn) { btn.disabled=true; btn.textContent='Signing in...'; }
  try {
    // Step 1: Authenticate
    var res = await S.db.auth.signInWithPassword({ email: email, password: pass });

    if (res.error) {
      var msg = res.error.message || '';
      if (msg.includes('Email not confirmed')) {
        throw new Error('Email not confirmed. Go to Supabase → Authentication → Users → click your email → Confirm email. Or disable email confirmation in Auth settings.');
      } else if (msg.includes('Invalid login') || msg.includes('invalid_credentials')) {
        throw new Error('Wrong email or password. If you have not registered yet, click Register below.');
      } else {
        throw new Error(msg || 'Sign in failed.');
      }
    }

    // Step 2: Load profile
    var pRes = await S.db.from('profiles').select('*').eq('id', res.data.user.id).single();

    if (pRes.error) {
      throw new Error('Profile error: ' + pRes.error.message + ' (code: ' + pRes.error.code + '). Try running: ALTER TABLE public.profiles DISABLE ROW LEVEL SECURITY; in Supabase SQL Editor.');
    }
    if (!pRes.data) {
      // Profile missing — create it on the fly
      var newProfile = { id: res.data.user.id, email: email, full_name: email.split('@')[0], role: 'student' };
      await S.db.from('profiles').insert(newProfile);
      pRes = await S.db.from('profiles').select('*').eq('id', res.data.user.id).single();
      if (!pRes.data) throw new Error('Could not create profile. Please run: ALTER TABLE public.profiles DISABLE ROW LEVEL SECURITY; in Supabase SQL Editor.');
    }

    var role = pRes.data.role;

    // Step 3: Check role matches selected tab (warn if mismatch)
    if (loginRole === 'admin' && role !== 'admin') {
      throw new Error("Account [" + email + "] does not have admin role. Fix in Supabase SQL Editor: UPDATE public.profiles SET role = 'admin' WHERE email = '" + email + "';");
    }

    S.user    = res.data.user;
    S.profile = pRes.data;
    S.role    = role;

    var pages = { student:'student', doctor:'doctor', admin:'admin' };
    var tabs  = { student:'opportunities', doctor:'dr-overview', admin:'admin-overview' };
    S.tab = tabs[role] || 'opportunities';

    await loadDashData();
    showPage(pages[role] || 'student');
    toast('Welcome back, ' + pRes.data.full_name.split(' ')[0] + '! 👋');

  } catch(e) {
    if(err){ err.style.display='block'; err.textContent = e.message || 'Sign in failed.'; }
    if(btn){ btn.disabled=false; btn.textContent='Sign In'; }
  }
}

function markUploaded(id) { var el=$(id); if(el){el.className='badge badge-green';el.textContent='✓ Ready';} }

async function handleReg(step, max, isDoc) {
  var err = $('reg-err');
  var btn = $('reg-btn');
  if (err) err.style.display='none';

  // Collect data
  if (!isDoc && step===1) {
    var fn=$('r-fn')&&$('r-fn').value.trim(), ln=$('r-ln')&&$('r-ln').value.trim();
    var em=$('r-em')&&$('r-em').value.trim(), pw=$('r-pw')&&$('r-pw').value, pw2=$('r-pw2')&&$('r-pw2').value;
    if (!fn||!ln||!em||!pw) { if(err){err.style.display='block';err.textContent='Please fill all required fields.';} return; }
    if (pw!==pw2) { if(err){err.style.display='block';err.textContent='Passwords do not match.';} return; }
    if (pw.length<8) { if(err){err.style.display='block';err.textContent='Password must be at least 8 characters.';} return; }
    S.regData = { fn:fn, ln:ln, em:em, pw:pw, ph:$('r-ph')&&$('r-ph').value };
  }
  if (!isDoc && step===2) {
    S.regData.school = $('r-school')&&$('r-school').value;
    S.regData.gpa    = $('r-gpa')&&$('r-gpa').value;
    S.regData.major  = $('r-maj')&&$('r-maj').value;
    S.regData.stmt   = $('r-stmt')&&$('r-stmt').value;
  }
  if (isDoc && step===1) {
    S.regData.drfn=$('dr-fn')&&$('dr-fn').value.trim();
    S.regData.drln=$('dr-ln')&&$('dr-ln').value.trim();
    S.regData.drem=$('dr-em')&&$('dr-em').value.trim();
    S.regData.drpw=$('dr-pw')&&$('dr-pw').value;
    S.regData.drnpi=$('dr-npi')&&$('dr-npi').value;
    S.regData.drlic=$('dr-lic')&&$('dr-lic').value;
    S.regData.drst=$('dr-st')&&$('dr-st').value;
    S.regData.drph=$('dr-ph')&&$('dr-ph').value;
    if (!S.regData.drfn||!S.regData.drln||!S.regData.drem||!S.regData.drpw) { if(err){err.style.display='block';err.textContent='Please fill all required fields.';} return; }
  }
  if (isDoc && step===2) {
    S.regData.drpr=$('dr-pr')&&$('dr-pr').value;
    S.regData.drsp=$('dr-sp')&&$('dr-sp').value;
    S.regData.draddr=$('dr-addr')&&$('dr-addr').value;
    S.regData.drmx=parseInt($('dr-mx')&&$('dr-mx').value)||2;
    S.regData.drsub=$('dr-sub')&&$('dr-sub').value;
    S.regData.drbio=$('dr-bio')&&$('dr-bio').value;
  }

  // Final step
  if (!isDoc && step===max) {
    if (!S.db) {
      toast('Not connected yet. Please wait a moment and try again.', 'error'); return;
    }

    if(btn){btn.disabled=true; btn.textContent='Creating account...';}
    if(err){err.style.display='none';}

    try {
      // ── Step 1: Create Supabase account ──
      toast('Creating your account...', 'info');
      var sRes = await S.db.auth.signUp({
        email: S.regData.em,
        password: S.regData.pw,
        options: {
          data: { full_name: S.regData.fn + ' ' + S.regData.ln, role: 'student' },
          emailRedirectTo: undefined
        }
      });

      if (sRes.error) {
        var errMsg = sRes.error.message || '';
        if (errMsg.toLowerCase().includes('already registered') || errMsg.toLowerCase().includes('already been registered')) {
          throw new Error('An account with this email already exists. Please sign in instead.');
        }
        if (errMsg.toLowerCase().includes('rate limit')) {
          throw new Error('Too many signups attempted. Please wait 1 hour and try again, or ask admin to disable email confirmation in Supabase → Authentication → Configuration → Email.');
        }
        throw new Error('Account error: ' + errMsg);
      }

      // ── Step 2: Sign in ──
      if(btn) btn.textContent = 'Signing in...';
      var lRes = await S.db.auth.signInWithPassword({
        email: S.regData.em,
        password: S.regData.pw
      });
      if (lRes.error) throw new Error('Sign-in error: ' + lRes.error.message);
      var uid = lRes.data.user.id;

      // ── Step 3: Save student record (free — no payment required) ──
      if(btn) btn.textContent = 'Saving profile...';
      var insRes = await S.db.from('students').insert({
        id: uid,
        university: S.regData.school || '',
        major: S.regData.major || '',
        personal_statement: S.regData.stmt || '',
        gpa: parseFloat(S.regData.gpa) || null,
        reg_fee_paid: true,
        reg_fee_paid_at: new Date().toISOString(),
        stripe_payment_id: 'FREE_PROMO_MONTH1',
        verification_status: 'pending'
      });
      if (insRes.error) throw new Error('Database error: ' + insRes.error.message);

      // ── Done ──
      S.user = lRes.data.user;
      var pRes = await S.db.from('profiles').select('*').eq('id',uid).single();
      S.profile = pRes.data; S.role='student'; S.tab='opportunities';

      // Notify admin of new student registration (non-blocking)
      notifyAdmin(
        'Student',
        S.regData.fn + ' ' + S.regData.ln,
        S.regData.em,
        S.regData.school || '—'
      );

      await loadDashData();
      showPage('student');
      toast('Registration complete! Welcome to MedShadow 🎉');

    } catch(e) {
      if(err){err.style.display='block';err.textContent=e.message||'Payment failed. Please check your card details.';}
      if(btn){btn.disabled=false;btn.textContent='Complete Registration →';}
    }
    return;
  }

  if (isDoc && step===max) {
    if (!S.db) { toast('Not connected to server yet.','error'); return; }
    if(btn){btn.disabled=true;btn.textContent='Submitting...';}
    try {
      var sRes = await S.db.auth.signUp({ email:S.regData.drem, password:S.regData.drpw, options:{data:{full_name:'Dr. '+S.regData.drfn+' '+S.regData.drln,role:'doctor'}} });
      if (sRes.error) throw sRes.error;
      var lRes = await S.db.auth.signInWithPassword({ email:S.regData.drem, password:S.regData.drpw });
      if (lRes.error) throw lRes.error;
      var uid = lRes.data.user.id;
      await S.db.from('doctors').insert({ id:uid, npi_number:S.regData.drnpi, license_number:S.regData.drlic, license_state:S.regData.drst, specialty:S.regData.drsp, practice_name:S.regData.drpr, practice_address:S.regData.draddr, max_students:S.regData.drmx, bio:S.regData.drbio, sub_specialty:S.regData.drsub, verification_status:'pending', is_verified:false });
      await S.db.from('profiles').update({phone:S.regData.drph}).eq('id',uid);
      S.user=lRes.data.user; var pRes=await S.db.from('profiles').select('*').eq('id',uid).single();
      S.profile=pRes.data; S.role='doctor'; S.tab='dr-overview';

      // Notify admin of new physician registration (non-blocking)
      notifyAdmin(
        'Physician',
        'Dr. ' + S.regData.drfn + ' ' + S.regData.drln,
        S.regData.drem,
        S.regData.drpr || '—'
      );

      showPage('doctor');
      toast('Application submitted! Admin has been notified and will verify within 1–3 business days.');
    } catch(e) { if(err){err.style.display='block';err.textContent=e.message||'Registration failed.';} if(btn){btn.disabled=false;btn.textContent='Submit for Verification →';} }
    return;
  }

  S.regStep = step+1; showPage('register');
}

async function adminRejectStudent(id) {
  var reason = prompt('Reason for rejection (sent to student):','Please resubmit with valid documentation.');
  if (!reason) return;
  try {
    await S.db.from('students').update({verification_status:'rejected'}).eq('id',id);
    await S.db.from('notifications').insert({user_id:id,title:'Verification Update',message:reason,type:'error'});
    S.adminStudents=S.adminStudents.map(function(s){return s.id===id?Object.assign({},s,{verification_status:'rejected'}):s;});
    render(); toast('Student rejected and notified.');
  } catch(e) { toast(e.message,'error'); }
}

function contentAdminVerify() {

  var students = S.adminStudents;
  var compReqs = S.compliance || [];

  // Build doc map per student: { studentId: [doc, doc, ...] }
  var docsByStudent = {};
  allDocs.forEach(function(d) {
    if (!docsByStudent[d.student_id]) docsByStudent[d.student_id] = [];
    docsByStudent[d.student_id].push(d);
  });

  // Also include students who have pending docs but may not be in allDocs yet
  // Build list of students who have ANY docs
  var studentIdsWithDocs = Object.keys(docsByStudent);

  var statusIcon = { verified:'✓', pending:'⏳', rejected:'✕', under_review:'👁' };

            '<span class="badge badge-gray">No docs</span>' +
          '</div>';
        }).join('') +
      '</div>'
    : '') +

    // Students WITH documents — show full compliance card per student
    students.filter(function(s){ return !!docsByStudent[s.id]; }).map(function(s) {
      var name   = (s.profiles && s.profiles.full_name) || 'Unknown';
      var email  = (s.profiles && s.profiles.email)     || '—';
      var docs   = docsByStudent[s.id] || [];
      var hasPending   = docs.some(function(d){return d.status==='pending';});
      var allVerified  = docs.length > 0 && docs.every(function(d){return d.status==='verified';});
      var hasRejected  = docs.some(function(d){return d.status==='rejected';});
      var borderColor  = hasPending?'#D97706':allVerified?'#059669':hasRejected?'#DC2626':'#E2E8F0';
      var headerBg     = hasPending?'#FFFBEB':allVerified?'#F0FDF4':hasRejected?'#FEF2F2':'#F8FAFC';

      return '<div class="card" style="margin-bottom:1rem;border:2px solid '+borderColor+'">' +

        // Student header
        '<div style="background:'+headerBg+';border-radius:10px 10px 0 0;padding:12px 1rem;margin:-1.5rem -1.5rem 1rem;display:flex;align-items:center;gap:12px">' +
          '<div class="avatar" style="width:42px;height:42px;font-size:15px">'+initials(name)+'</div>' +
          '<div style="flex:1">' +
            '<strong style="font-size:15px">'+name+'</strong>' +
            '<div style="font-size:13px;color:#475569">'+email+'</div>' +
            '<div style="font-size:12px;color:#94A3B8;margin-top:2px">'+
              docs.filter(function(d){return d.status==='verified';}).length+'/'+docs.length+' documents verified · ' +
              'Account: <span style="color:'+(s.verification_status==='verified'?'#059669':'#D97706')+'">'+s.verification_status+'</span>' +
            '</div>' +
          '</div>' +
          '<div style="display:flex;gap:6px;flex-wrap:wrap">' +
            (s.verification_status!=='verified'?
              '<button class="btn btn-sm btn-success" onclick="adminVerifyStudent(\''+s.id+'\')">✓ Verify Account</button>':
              '<span class="badge badge-green">Account Verified</span>'
            ) +
            (hasPending?
              '<button class="btn btn-sm btn-primary" onclick="adminApproveAllDocs(\''+s.id+'\')">✓ Approve All Pending</button>':''
            ) +
          '</div>' +
        '</div>' +

        // Compliance checklist
        '<div style="margin-bottom:1rem">' +
          '<div style="font-size:12px;font-weight:700;color:#94A3B8;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Compliance Checklist</div>' +
          compReqs.map(function(req) {
            var matchingDoc = docs.find(function(d){
              return d.document_name.toLowerCase().includes(req.name.toLowerCase().split(' ').slice(0,2).join(' ').toLowerCase()) ||
                     d.document_type === req.document_type;
            });
            var status = matchingDoc ? matchingDoc.status : 'missing';
            var icon   = status==='verified'?'✓':status==='pending'?'⏳':status==='rejected'?'✕':'✗';
            var color  = status==='verified'?'#059669':status==='pending'?'#D97706':status==='rejected'?'#DC2626':'#94A3B8';
            return '<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #F1F5F9">' +
              '<span style="color:'+color+';font-weight:700;width:16px;text-align:center">'+icon+'</span>' +
              '<span style="font-size:13px;color:#1E293B;flex:1">'+req.name+'</span>' +
              '<span class="badge badge-'+( status==='verified'?'green':status==='pending'?'amber':status==='rejected'?'red':'gray' )+'">'+
                (status==='missing'?'Not uploaded':status)+
              '</span>' +
            '</div>';
          }).join('') +
        '</div>' +

        // Documents list
        '<div style="font-size:12px;font-weight:700;color:#94A3B8;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Uploaded Documents</div>' +
        docs.map(function(d) {
          var icon  = statusIcon[d.status]  || '?';
          var color = statusColor[d.status] || '#94A3B8';
          var badge = badgeClass[d.status]  || 'badge-gray';
          return '<div style="display:flex;align-items:center;gap:10px;padding:9px 12px;background:#F8FAFC;border-radius:8px;margin-bottom:6px;border:1px solid #E2E8F0">' +
            '<span style="color:'+color+';font-weight:700;font-size:16px;width:20px;text-align:center">'+icon+'</span>' +
            '<div style="flex:1;min-width:0">' +
              '<div style="font-weight:600;font-size:13px">'+d.document_name+'</div>' +
              '<div style="font-size:12px;color:#94A3B8">'+d.document_type+' · Uploaded '+new Date(d.created_at).toLocaleDateString()+'</div>' +
              (d.review_notes?'<div style="font-size:12px;color:#DC2626;margin-top:2px">Note: '+d.review_notes+'</div>':'') +
            '</div>' +
            '<span class="badge '+badge+'">'+d.status+'</span>' +
            '<div style="display:flex;gap:4px">' +
              (d.file_path?'<button class="btn btn-sm btn-ghost" onclick="adminViewDoc(\''+d.file_path+'\')">👁</button>':'') +
              (d.status==='pending'?
                '<button class="btn btn-sm btn-success" onclick="adminApprove(\''+d.id+'\',\''+d.student_id+'\')">✓</button>' +
                '<button class="btn btn-sm btn-danger"  onclick="adminReject(\''+d.id+'\',\''+d.student_id+'\')">✕</button>'
              :'') +
              (d.status==='rejected'?
                '<span style="font-size:12px;color:#DC2626">Resubmission required</span>'
              :'') +
            '</div>' +
          '</div>';
        }).join('') +

      '</div>';
    }).join('')

    ); // end conditional

  return html;
}

// Approve all pending docs for a student at once
async function adminApproveAllDocs(studentId) {
  if (!confirm('Approve ALL pending documents for this student?')) return;
  try {
    var pending = (S.allDocs||[]).filter(function(d){return d.student_id===studentId && d.status==='pending';});
    for (var i=0; i<pending.length; i++) {
      await S.db.from('student_documents').update({
        status:'verified', review_notes:'Approved by admin.',
        reviewed_by:S.user.id, reviewed_at:new Date().toISOString()
      }).eq('id',pending[i].id);
    }
    await S.db.from('notifications').insert({
      user_id:studentId, title:'Documents Verified ✓',
      message:'All your uploaded documents have been approved! You can now enroll in shadowing opportunities.',
      type:'success'
    });
    await refreshVerifyQueue();
    toast('All documents approved and student notified!');
  } catch(e) { toast(e.message||'Approve failed','error'); }
}

// Refresh verify queue without full page reload
async function refreshVerifyQueue() {
  try {
    var allDocs = (await S.db.from('student_documents').select('*').order('created_at',{ascending:false})).data || [];
    S.allDocs = allDocs;
    S.verifyQueue = allDocs.filter(function(d){return d.status==='pending';}).map(function(d){
      var prof = {};
      S.adminStudents.forEach(function(s){ if(s.id===d.student_id) prof=s.profiles||{}; });
      return Object.assign({},d,{students:{profiles:prof}});
    });
    render();
    toast('Refreshed!');
  } catch(e) { toast(e.message||'Refresh failed','error'); }
}

// ─────────────────────────────────────────────
// DATA ACTIONS
// ─────────────────────────────────────────────
async function loadDashData() {
  if (!S.db) return;
  try {
    if (S.role==='student') {
      var [dr,cr,cm,docs,enr] = await Promise.allSettled([
        S.db.from('doctors').select('*,profiles:id(full_name,email),doctor_availability(day_of_week,start_time,end_time,is_active)').eq('is_verified',true).eq('is_accepting',true).order('rating',{ascending:false}),
        S.db.from('courses').select('*').eq('is_active',true).order('sort_order'),
        S.db.from('compliance_requirements').select('*').eq('scope','global'),
        S.db.from('student_documents').select('*').eq('student_id',S.user.id).order('created_at',{ascending:false}),
        S.db.from('shadowing_enrollments').select('*,doctors:doctor_id(specialty,practice_name,profiles:id(full_name))').eq('student_id',S.user.id).order('session_date',{ascending:false}),
      ]);
      S.doctors    = dr.status==='fulfilled'&&dr.value.data   ? dr.value.data   : [];
      S.courses    = cr.status==='fulfilled'&&cr.value.data   ? cr.value.data   : [];
      S.compliance = cm.status==='fulfilled'&&cm.value.data   ? cm.value.data   : [];
      S.documents  = docs.status==='fulfilled'&&docs.value.data ? docs.value.data : [];
      S.enrollments= enr.status==='fulfilled'&&enr.value.data ? enr.value.data  : [];
    } else if (S.role==='doctor') {
      var [dRes,avRes,crRes] = await Promise.allSettled([
        S.db.from('doctors').select('*').eq('id',S.user.id).single(),
        S.db.from('doctor_availability').select('*').eq('doctor_id',S.user.id),
        S.db.from('courses').select('*').eq('is_active',true).order('sort_order'),
      ]);
      S.doctorData = dRes.status==='fulfilled' ? dRes.value.data : null;
      S.doctorAvail= avRes.status==='fulfilled'&&avRes.value.data ? avRes.value.data : [];
      S.courses    = crRes.status==='fulfilled'&&crRes.value.data ? crRes.value.data : [];
    } else if (S.role==='admin') {
      // Fetch profiles + students + doctors separately then merge
      // (avoids FK join issues with Supabase PostgREST)
      var allProfiles = (await S.db.from('profiles').select('*').order('created_at',{ascending:false})).data || [];
      var allStudents = (await S.db.from('students').select('*').order('created_at',{ascending:false})).data || [];
      var allDoctors  = (await S.db.from('doctors').select('*').order('created_at',{ascending:false})).data || [];
      var allDocs     = (await S.db.from('student_documents').select('*').order('created_at',{ascending:false})).data || [];

      // Build profile lookup map
      var profileMap = {};
      allProfiles.forEach(function(p){ profileMap[p.id] = p; });

      // Merge profiles into students
      S.adminStudents = allStudents.map(function(s){
        return Object.assign({}, s, { profiles: profileMap[s.id] || {} });
      });

      // Merge profiles into doctors
      S.adminDoctors = allDoctors.map(function(d){
        return Object.assign({}, d, { profiles: profileMap[d.id] || {} });
      });

      // Store ALL docs (not just pending) for compliance view
      S.allDocs = allDocs;

      // Build verify queue — pending docs with student profile attached
      S.verifyQueue = allDocs
        .filter(function(d){ return d.status === 'pending'; })
        .map(function(d){
          var prof = profileMap[d.student_id] || {};
          return Object.assign({}, d, {
            students: { profiles: prof }
          });
        });

async function handleDocUp(event) {
  var file = event.target.files[0];
  if (!file) return;

  // Validate
  if (file.size > 10 * 1024 * 1024) { toast('File too large. Max 10MB.', 'error'); return; }
  var allowed = ['pdf','jpg','jpeg','png','gif','heic','doc','docx'];
  var ext = file.name.split('.').pop().toLowerCase();
  if (!allowed.includes(ext)) { toast('File type not allowed. Use PDF, JPG, or PNG.', 'error'); return; }
  if (!S.user) { toast('Please sign in first.', 'error'); return; }

  var name = ($('doc-name') && $('doc-name').value.trim()) || file.name.replace(/\.[^.]+$/, '');
  var type = ($('doc-type') && $('doc-type').value) || 'Other';
  if (!name) { toast('Please enter a document name first.', 'error'); return; }

  // Disable upload zones to prevent double-click
  var zones = document.querySelectorAll('.upload-zone');
  zones.forEach(function(z){ z.style.pointerEvents='none'; z.style.opacity='.6'; });
  toast('Uploading...', 'info');

  try {
    var safeName = name.replace(/[^a-zA-Z0-9._-]/g, '_').slice(0, 50);
    var filePath  = 'no-storage/' + S.user.id + '_' + Date.now() + '_' + safeName + '.' + ext;

    // Try storage upload first — but never block if it fails
    try {
      var storagePath = S.user.id + '/' + Date.now() + '_' + safeName + '.' + ext;
      var up = await S.db.storage.from('student-documents').upload(storagePath, file, { upsert: false });
      if (!up.error) {
        filePath = storagePath; // use real path if storage worked
      } else {
        console.warn('Storage upload skipped:', up.error.message);
      }
    } catch(storageErr) {
      console.warn('Storage not available:', storageErr.message);
    }

    // Always save record to database
    var ins = await S.db.from('student_documents').insert({
      student_id:    S.user.id,
      document_name: name,
      document_type: type,
      file_path:     filePath,
      file_name:     file.name,
      file_size:     file.size,
      status:        'pending'
    });

    if (ins.error) {
      throw new Error('Could not save document: ' + ins.error.message);
    }

    // Refresh document list
    var fresh = await S.db.from('student_documents')
      .select('*')
      .eq('student_id', S.user.id)
      .order('created_at', { ascending: false });
    S.documents = fresh.data || [];

    // Clear name field for next upload
    if ($('doc-name')) $('doc-name').value = '';

    render();
    toast(name + ' uploaded! Admin will verify it shortly.');

  } catch(e) {
    console.error('Upload error:', e);
    toast(e.message || 'Upload failed. Please try again.', 'error');
  } finally {
    // Re-enable upload zones
    zones.forEach(function(z){ z.style.pointerEvents=''; z.style.opacity=''; });
  }
}

// MODAL SYSTEM
var _modalSaveFn = null;
function showModal(title, bodyHtml, saveFn, saveLabel) {
  var overlay = $('modal-overlay');
  $('modal-title').textContent = title;
  $('modal-body').innerHTML = bodyHtml;
  // Always reset the button — key fix for re-opening modal after failed save
  var saveBtn = $('modal-save-btn');
  if (saveBtn) { saveBtn.textContent = saveLabel || 'Save'; saveBtn.disabled = false; }
  _modalSaveFn = saveFn;
  overlay.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  $('modal-overlay').style.display = 'none';
  document.body.style.overflow = '';
  _modalSaveFn = null;
}
function modalSave() { if (_modalSaveFn) _modalSaveFn(); }
document.addEventListener('click', function(e) {
  if (e.target && e.target.id === 'modal-overlay') { closeModal(); return; }

  var btn = e.target.closest('[data-action]');
  if (!btn) return;
  var action = btn.dataset.action;
  var id     = btn.dataset.id;

  if (action === 'edit')       openCourseModal(id);
  if (action === 'toggle')     adminToggleCourse(id, btn.dataset.val === '1');
  if (action === 'delete')     adminDeleteCourse(id, btn.dataset.name || 'this course');
  if (action === 'edit-comp')  openComplianceModal(id);
  if (action === 'del-comp') {
    var name = btn.closest('.card') && btn.closest('.card').querySelector('strong') && btn.closest('.card').querySelector('strong').textContent || 'this item';
    adminDeleteCompliance(id, name);
  }
  if (action === 'edit-ann')   openAnnounceModal(id);
  if (action === 'del-ann')    adminDeleteAnnounce(id);
});

function openOppModal(doctorId) {

    '</select></div>';

  var days = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  var slots12 = ['07:00','08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00'];

  var body = docSelect +
    '<div style="font-size:13px;font-weight:600;color:#475569;margin-bottom:8px">Select available time slots (click to toggle):</div>' +
    '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px">' +

    '</tr></thead><tbody>' +
    slots12.map(function(slot){
      return '<tr><td style="padding:4px 6px;font-size:11px;font-weight:600;color:#475569;white-space:nowrap">'+slot+'</td>' +
      days.map(function(day){
        var isOn = slots.some(function(s){return s.day_of_week===day&&s.start_time&&s.start_time.slice(0,5)===slot&&s.is_active;});
        return '<td style="text-align:center;padding:3px">' +
          '<button class="avail-slot-btn" data-day="'+day+'" data-time="'+slot+'" onclick="toggleOppSlot(this)" style="width:40px;height:26px;border-radius:5px;border:none;cursor:pointer;font-size:10px;font-weight:700;background:'+(isOn?'#0098B4':'#E2E8F0')+';color:'+(isOn?'#fff':'#94A3B8')+'">' +

    }).join('') +

  showModal(
    doc ? 'Edit Availability — '+(doc.profiles&&doc.profiles.full_name||'Physician') : 'Add Opportunity',
    body,
    function(){ saveOppSlots(doctorId); },
    'Save Availability'
  );
}

function toggleOppSlot(btn) {
  var on = btn.textContent.trim() === 'ON';
  btn.style.background = on ? '#E2E8F0' : '#0098B4';
  btn.style.color = on ? '#94A3B8' : '#fff';
  btn.textContent = on ? '–' : 'ON';
}

async function saveOppSlots(doctorId) {
  var id = doctorId || ($('opp-dr-id') && $('opp-dr-id').value);
  if (!id) { toast('Please select a physician','error'); return; }

  var btn = $('modal-save-btn');
  if(btn){btn.disabled=true;btn.textContent='Saving...';}

  var slots = [];
  document.querySelectorAll('.avail-slot-btn').forEach(function(b){
    if (b.textContent.trim() === 'ON') {
      var t = b.dataset.time;
      var eh = String(parseInt(t)+1).padStart(2,'0');
      slots.push({ doctor_id:id, day_of_week:b.dataset.day, start_time:t+':00', end_time:eh+':00:00', is_active:true });
    }
  });

  try {
    await S.db.from('doctor_availability').delete().eq('doctor_id', id);
    if (slots.length > 0) {
      var r = await S.db.from('doctor_availability').insert(slots);
      if (r.error) throw r.error;
    }
    await refreshAdminOpps();
    closeModal();
    toast('Availability saved! '+slots.length+' slots active.');
  } catch(e) {
    var err = $('opp-err');
    if(err){err.style.display='block';err.textContent=e.message||'Save failed.';}
    if(btn){btn.disabled=false;btn.textContent='Save Availability';}
  }
}

    var avail = (await S.db.from('doctor_availability').select('*')).data || [];
    S.adminAvail = avail;
    render();
  } catch(e) { toast(e.message,'error'); }

async function saveScheduleSession() {
  var studentId = $('sch-student') && $('sch-student').value;
  var doctorId  = $('sch-doctor')  && $('sch-doctor').value;
  var date      = $('sch-date')    && $('sch-date').value;
  var err = $('sch-err');
  var btn = $('modal-save-btn');

  if (!studentId||!doctorId||!date) {
    if(err){err.style.display='block';err.textContent='Please fill all required fields.';}
    return;
  }
  if(btn){btn.disabled=true;btn.textContent='Scheduling...';}

  try {
    var r = await S.db.from('shadowing_enrollments').insert({
      student_id:  studentId,
      doctor_id:   doctorId,
      session_date: date,
      start_time:  ($('sch-start').value||'08:00')+':00',
      end_time:    ($('sch-end').value||'12:00')+':00',
      status:      $('sch-status').value,
      doctor_notes: $('sch-notes').value || null
    });
    if (r.error) throw r.error;
    await refreshAdminSchedule();
    closeModal();
    toast('Session scheduled successfully!');
  } catch(e) {
    if(err){err.style.display='block';err.textContent=e.message||'Schedule failed.';}
    if(btn){btn.disabled=false;btn.textContent='Schedule Session';}
  }
}

async function refreshAdminSchedule() {
  try {
    var enr = (await S.db.from('shadowing_enrollments').select('*').order('session_date',{ascending:false})).data || [];
    var profs = (await S.db.from('profiles').select('id,full_name')).data || [];
    var pm = {}; profs.forEach(function(p){pm[p.id]=p;});
    S.adminEnrollments = enr.map(function(e){
      return Object.assign({},e,{ studentProfile: pm[e.student_id]||{}, doctorProfile: pm[e.doctor_id]||{} });
    });
    render();

}

async function adminCreateDr() {
  var btn=$('adr-btn'); if(btn){btn.disabled=true;btn.textContent='Creating...';}
  var fn=$('adr-fn')&&$('adr-fn').value.trim(), ln=$('adr-ln')&&$('adr-ln').value.trim();
  var em=$('adr-em')&&$('adr-em').value.trim(), pw=$('adr-pw')&&$('adr-pw').value;
  if (!fn||!ln||!em||!pw) { toast('Please fill all required fields','error'); if(btn){btn.disabled=false;btn.textContent='Create & Verify Physician';} return; }
  try {
    // Step 1: Create auth account
    var sRes = await S.db.auth.signUp({
      email: em, password: pw,
      options: { data: { full_name: 'Dr. '+fn+' '+ln, role: 'doctor' } }
    });
    if (sRes.error) {
      if (sRes.error.message.toLowerCase().includes('already')) throw new Error('An account with this email already exists.');
      throw sRes.error;
    }
    var uid = sRes.data.user.id;

    // Step 2: Create doctor record
    var spec = $('adr-sp')&&$('adr-sp').value;
    var prac = $('adr-pr')&&$('adr-pr').value;
    var npi  = $('adr-npi')&&$('adr-npi').value;
    var addr = $('adr-addr')&&$('adr-addr').value;
    var bio  = $('adr-bio')&&$('adr-bio').value;
    var mx   = parseInt($('adr-mx')&&$('adr-mx').value)||2;

    var dRes = await S.db.from('doctors').insert({
      id: uid, specialty: spec, practice_name: prac,
      npi_number: npi, practice_address: addr, bio: bio,
      max_students: mx, is_verified: true, is_accepting: true,
      verification_status: 'verified'
    });
    if (dRes.error) throw dRes.error;

    // Step 3: Make sure profile has doctor role
    await S.db.from('profiles').update({ role: 'doctor', phone: $('adr-ph')&&$('adr-ph').value }).eq('id', uid);

    // Step 4: Reload all doctors + profiles separately and merge
    var allProfiles = (await S.db.from('profiles').select('*')).data || [];
    var allDoctors  = (await S.db.from('doctors').select('*').order('created_at',{ascending:false})).data || [];
    var pm = {}; allProfiles.forEach(function(p){ pm[p.id]=p; });
    S.adminDoctors = allDoctors.map(function(d){ return Object.assign({},d,{profiles:pm[d.id]||{}}); });

    // Step 5: Add default availability if days were selected
    var days = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
    var selectedDays = days.filter(function(d){ var cb=$('adr-day-'+d.toLowerCase()); return cb&&cb.checked; });
    if (selectedDays.length > 0) {
      var slots = selectedDays.map(function(day){ return { doctor_id:uid, day_of_week:day, start_time:'08:00:00', end_time:'12:00:00', is_active:true }; });
      await S.db.from('doctor_availability').insert(slots);
    }

    setTab('admin-doctors');
    toast('Dr. '+fn+' '+ln+' created, verified, and ready!');
  } catch(e) {
    toast(e.message||'Failed to create physician','error');
    if(btn){btn.disabled=false;btn.textContent='Create & Verify Physician';}
  }
}

function exportCsv() {
  var rows=[['Name','Email','Status','Fee Paid','Joined']].concat(S.adminStudents.map(function(s){return[s.profiles&&s.profiles.full_name||'',s.profiles&&s.profiles.email||'',s.verification_status,s.reg_fee_paid?'Yes':'No',new Date(s.profiles&&s.profiles.created_at||Date.now()).toLocaleDateString()];}));
  var csv=rows.map(function(r){return r.join(',');}).join('\n');
  var a=document.createElement('a'); a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv); a.download='medshadow_students.csv'; a.click();
}

// ─────────────────────────────────────────────
// INIT — load Supabase dynamically, never block
// ─────────────────────────────────────────────
function loadScript(src,cb){var s=document.createElement('script');s.src=src;s.async=true;s.onload=cb;s.onerror=function(){console.warn('Failed to load: '+src);if(cb)cb();};document.head.appendChild(s);}

function startApp() {
  // Show landing immediately
  render();

  // Load Supabase then Stripe
  loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2', function() {
    try {
      S.db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: false
        }
      });

      // Test connection and show status
      (async function testConn() {
        var bar = document.getElementById('conn-status');
        try {
          var t = await Promise.race([
            S.db.from('profiles').select('id').limit(1),
            new Promise(function(_,reject){ setTimeout(function(){ reject(new Error('timeout')); }, 8000); })
          ]);
          if (t.error) throw t.error;
          if (bar) { bar.style.background='#059669'; bar.textContent='✓ Connected to MedShadow server'; setTimeout(function(){ bar.style.display='none'; }, 3000); }
        } catch(e) {
          if (bar) {
            bar.style.background='#DC2626';
            if (e.message === 'timeout') {
              bar.textContent='⚠ Server connection timed out — Supabase project may be paused. Go to supabase.com and restore your project.';
            } else if (e.message && e.message.includes('Failed to fetch')) {
              bar.textContent='⚠ Failed to reach database — Check supabase.com: your project may be paused or the URL is wrong.';
            } else {
              bar.textContent='⚠ Connection error: ' + (e.message || 'Unknown error') + ' — Check Supabase dashboard.';
            }
          }
        }
      })();
      // Check for existing session
      S.db.auth.getSession().then(function(res) {
        var session = res && res.data && res.data.session;
        if (session && session.user) {
          S.db.from('profiles').select('*').eq('id',session.user.id).single().then(function(pRes) {
            if (pRes.data) {
              S.user=session.user; S.profile=pRes.data; S.role=pRes.data.role;
              var tabs={student:'opportunities',doctor:'dr-overview',admin:'admin-overview'};
              S.tab=tabs[S.role]||'opportunities';
              loadDashData().then(function(){ showPage(S.role); });
            }
          });
        }
      }).catch(function(){});
      // Auth state listener
      S.db.auth.onAuthStateChange(function(event) {
        if (event==='SIGNED_OUT'){S.user=null;S.profile=null;S.role=null;showPage('landing');}
      });
    } catch(e) { console.warn('Supabase init error:',e); }
  });

  loadScript('https://js.stripe.com/v3/', function() {
    try { S.stripe = Stripe(STRIPE_PUB_KEY); } catch(e) { console.warn('Stripe init error:',e); }
  });
}

// Start immediately when DOM is ready
if (document.readyState==='loading') {
  document.addEventListener('DOMContentLoaded', startApp);
} else {
  startApp();
}
</script>
